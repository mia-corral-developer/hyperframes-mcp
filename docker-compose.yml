services:
  hyperframes-mcp:
    build:
      context: https://github.com/mia-corral-developer/hyperframes-mcp.git#main
      dockerfile: Dockerfile
    image: hyperframes-mcp:latest
    restart: unless-stopped
    environment:
      # Set a token to require "Authorization: Bearer <token>" on every call
      # (except the public /health). Leave empty to keep the endpoint open.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_TRANSPORT: http
      HF_WORKSPACE: /data/projects
      HF_JOBS_DIR: /data/jobs
      # Renders are CPU-bound: keep concurrency at 1 unless you size the box up.
      HF_JOB_CONCURRENCY: ${HF_JOB_CONCURRENCY:-1}
      PORT: "8080"
    volumes:
      - hf-mcp-projects:/data/projects
      - hf-mcp-jobs:/data/jobs
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.hf-mcp-web.rule=Host(`hyperframes-mcp.lab.whitelabel.lat`)
      - traefik.http.routers.hf-mcp-web.entrypoints=web
      - traefik.http.routers.hf-mcp-web.service=hf-mcp-web
      - traefik.http.routers.hf-mcp-web.middlewares=redirect-to-https@file

      - traefik.http.routers.hf-mcp-websecure.rule=Host(`hyperframes-mcp.lab.whitelabel.lat`)
      - traefik.http.routers.hf-mcp-websecure.entrypoints=websecure
      - traefik.http.routers.hf-mcp-websecure.service=hf-mcp-websecure
      - traefik.http.routers.hf-mcp-websecure.tls.certresolver=letsencrypt

      - traefik.http.services.hf-mcp-web.loadbalancer.server.port=8080
      - traefik.http.services.hf-mcp-websecure.loadbalancer.server.port=8080
    networks:
      - dokploy-network

volumes:
  hf-mcp-projects:
  hf-mcp-jobs:

networks:
  dokploy-network:
    external: true
